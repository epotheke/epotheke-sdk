publish-to-github:
  stage: publish
  image: debian:trixie-20250811-slim
  tags:
    - "podman"
  script:
    - apt-get update && apt-get upgrade -y && apt-get install -y jq curl zip
    # Create Release
    - TAG=$(echo "${CI_COMMIT_TAG}" | cut -c 2-)
    - >-
      RELEASE_ID=$(curl -X POST -v \
        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        -H "X-GitHub-Api-Version: 2026-03-10" \
        https://api.github.com/repos/epotheke/epotheke-sdk/releases \
        -d '{ "tag_name":"'"${CI_COMMIT_TAG}"'", "name":"'"${TAG}"'", "draft":false, "prerelease":false, "generate_release_notes":false }' | jq '.id')
    # Upload iOS Framework
    - zip -r epothekePod.zip LICENSE* epotheke.xcframework
    - >-
      curl -X POST -v \
        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        -H "X-GitHub-Api-Version: 2026-03-10" \
        -H "Content-Type: application/zip" \
        --data-binary "@epothekePod.zip" \
        https://uploads.github.com/repos/epotheke/epotheke-sdk/releases/${RELEASE_ID}/assets?name=epotheke-CocoaPod.zip
  dependencies:
    - "build-cocoapod"
  needs:
    - "build-cocoapod"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc.\d+)?$/

prepare-ios-pod-spec:
  stage: publish
  tags:
    - "mac"
    - "dev-cert"
  script:
    - TAG=$(echo "${CI_COMMIT_TAG}" | cut -c 2-)

    - sed "s/^end$//g" epotheke-sdk.podspec > tmp.podspec
    - mv tmp.podspec epotheke-sdk.podspec
    - sed "s/^.*spec.source.*$//g" epotheke-sdk.podspec > tmp.podspec
    - mv tmp.podspec epotheke-sdk.podspec

    - echo "spec.source            = { :http => 'https://github.com/epotheke/epotheke-sdk/releases/download/"${CI_COMMIT_TAG}"/epotheke-CocoaPod.zip' }" >> epotheke-sdk.podspec

    - echo end >> epotheke-sdk.podspec
  artifacts:
    name: 'epotheke-sdk.podspec'
    paths:
      - epotheke-sdk.podspec
  dependencies:
    - "build-cocoapod"
    - "publish-to-github"
  needs:
    - "publish-to-github"
    - "build-cocoapod"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc.\d+)$/
      when: manual
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

publish-ios-pod-spec:
  stage: publish
  tags:
    - "mac"
    - "dev-cert"
  script:
    - |
      cat > "$CI_PROJECT_DIR/cocoapods-lint.xcconfig" <<'EOF'
      ARCHS = arm64
      ONLY_ACTIVE_ARCH = YES
      EXCLUDED_ARCHS[sdk=iphonesimulator*] = x86_64
      EOF
    - XCODE_XCCONFIG_FILE="$CI_PROJECT_DIR/cocoapods-lint.xcconfig" /opt/homebrew/bin/pod spec lint epotheke-sdk.podspec --verbose
    - export VERSION=$(echo "${CI_COMMIT_TAG}" | cut -c 6-)
    - git clone "https://git.ecsec.de/ecpub/cocoa-pods.git"
    - mkdir -p cocoa-pods/epotheke-sdk/${VERSION}
    - mv epotheke-sdk.podspec cocoa-pods/epotheke-sdk/${VERSION}/
    - cd cocoa-pods
    - git remote set-url origin https://cocoapod:${COCOAPOD_GITLAB_TOKEN}@git.ecsec.de/ecpub/cocoa-pods.git
    - git add .
    - git commit -m "CI Publish new epotheke-sdk version ${VERSION}"
    - git push
  dependencies:
    - "prepare-ios-pod-spec"
  needs:
    - "prepare-ios-pod-spec"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc.\d+)$/
      when: manual
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

